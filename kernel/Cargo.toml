[package]
name = "kernel"
version = "0.1.0"
edition = "2024"

[features]
default = []
bootanim = []
cpu_slow = []
forceslowlogging = []
fat_trace = []
usb_trace = []
ps2_trace = []
heap_trace = []
heap_debug = []
kernelmb2 = []
selftest = []
iommu_trace = []
