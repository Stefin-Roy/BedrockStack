[package]
name = "init"
version = "0.1.0"
edition = "2024"

# Standalone workspace root: this crate must NOT inherit the root
# workspace's `.cargo/config.toml` (which forces the kernel linker script
# onto every `x86_64-unknown-none` build). Building `init` uses its own
# config at `init/.cargo/config.toml`.
[workspace]

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
